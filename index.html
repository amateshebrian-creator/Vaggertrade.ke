<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderScheme Custom Platform Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #fff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1f2833; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #45f3ff; }
        .logo { font-weight: bold; font-size: 20px; color: #45f3ff; }
        .status-container { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; }
        
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        
        .card { background: #161a22; padding: 20px; border-radius: 8px; border: 1px solid #242936; }
        .card h3 { margin-bottom: 15px; color: #c5a880; font-size: 16px; letter-spacing: 0.5px; }
        
        .metric-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #242936; }
        .metric-value { font-weight: bold; color: #00ff88; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #8b949e; font-size: 13px; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; background: #0b0c10; border: 1px solid #242936; padding: 10px; color: #fff; border-radius: 6px; outline: none; }
        .form-group input:focus { border-color: #45f3ff; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 14px; }
        .btn-start { background: linear-gradient(135deg, #00ff88, #00b359); color: #000; }
        .btn-stop { background: #ff4444; color: #fff; }
        
        .console { background: #000; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #00ff88; padding: 15px; border-radius: 6px; height: 200px; overflow-y: auto; white-space: pre-line; border: 1px solid #242936; }
    </style>
</head>
<body>

    <!-- 🟢 Platform Header Wrapper -->
    <div class="header">
        <div class="logo">TRADERSCHEME ENGINE</div>
        <div class="status-container">
            <div id="statusDot" class="dot"></div>
            <span id="statusText" style="color: #8b949e; font-size: 14px;">Offline</span>
        </div>
    </div>

    <div class="grid-container">
        <!-- ⚙️ Parameters Input Settings Panel -->
        <div class="card">
            <h3>PREMIUM BOT PARAMETERS</h3>
            <div class="form-group">
                <label>Target Execution Engine</label>
                <select id="strategyDropdown">
                    <option value="Martingale">AEX AI Scalper (Martingale Loop)</option>
                    <option value="Flat">Quantum Core (Fixed Risk Mode)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Initial Stake Amount ($)</label>
                <input type="number" id="initialStake" value="10">
            </div>
            <div class="form-group">
                <label>Maximum Stake Risk Cap ($)</label>
                <input type="number" id="maxStake" value="5000">
            </div>
            <div class="form-group">
                <label>Take Profit Target ($)</label>
                <input type="number" id="takeProfit" value="100">
            </div>
            
            <button id="startBtn" class="btn btn-start">ACTIVATE PREMIUM SCRIPT</button>
            <button id="stopBtn" class="btn btn-stop">EMERGENCY DISCONNECT</button>
        </div>

        <!-- 📊 Live Metrics Tracker Display -->
        <div class="card">
            <h3>LIVE SYSTEM METRICS</h3>
            <div class="metric-row">
                <span>Account Balance:</span>
                <span id="balance" class="metric-value" style="color: #fff;">$20,375.81</span>
            </div>
            <div class="metric-row">
                <span>Active Working Stake:</span>
                <span id="stake" class="metric-value" style="color: #45f3ff;">$0.00</span>
            </div>
            <div class="metric-row">
                <span>Net Profit / Loss Session:</span>
                <span id="profit" class="metric-value">$0.00</span>
            </div>
            
            <h3>LIVE STREAM ACTIVITY LOG</h3>
            <div id="log" class="console">Waiting for engine validation parameters...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
