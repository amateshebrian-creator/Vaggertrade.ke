<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vaggertrade Engine</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050805;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #183018;
      margin-bottom: 20px;
    }

    .logo {
      color: #39ff14;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #777;
    }

    .online .dot {
      background: #39ff14;
      box-shadow: 0 0 10px #39ff14;
    }

    .card {
      background: #0a0f0a;
      border: 1px solid #183018;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 0 20px rgba(57,255,20,0.04);
    }

    h2 {
      color: #39ff14;
      font-size: 16px;
      margin-bottom: 18px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 20px;
      font-size: 14px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      background: #050705;
      color: white;
      border: 1px solid #284528;
      border-radius: 7px;
      padding: 13px;
      margin-bottom: 16px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #39ff14;
      box-shadow: 0 0 8px rgba(57,255,20,0.2);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .start {
      background: #39ff14;
      color: #000;
      box-shadow: 0 0 15px rgba(57,255,20,0.3);
    }

    .start:hover {
      background: #62ff46;
    }

    .stop {
      background: #220808;
      color: #ff4444;
      border: 1px solid #661818;
      margin-top: 10px;
    }

    .stop:hover {
      background: #350909;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .metric {
      background: #050705;
      border: 1px solid #183018;
      border-radius: 8px;
      padding: 15px;
    }

    .metric-title {
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 19px;
      color: #39ff14;
      font-weight: bold;
    }

    .log {
      background: #020402;
      border: 1px solid #183018;
      border-radius: 8px;
      min-height: 180px;
      max-height: 300px;
      overflow-y: auto;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #9cff88;
    }

    .log-line {
      margin-bottom: 7px;
    }

    .warning {
      color: #aaa;
      font-size: 12px;
      line-height: 1.6;
    }

    .engine-status {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      border-radius: 7px;
      background: #111;
      color: #aaa;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
        gap: 10px;
      }

      .logo {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <div class="logo">VAGGERTRADE ENGINE</div>

    <div class="status" id="connectionStatus">
      <span class="dot"></span>
      <span id="statusText">Offline</span>
    </div>
  </header>


  <div class="card">

    <h2>PREMIUM BOT PARAMETERS</h2>

    <div class="subtitle">
      Target Execution Engine
    </div>

    <label for="initialStake">
      Initial Stake Amount ($)
    </label>

    <input
      type="number"
      id="initialStake"
      value="2"
      min="0.35"
      step="0.01"
    >


    <label for="maxStake">
      Maximum Stake Risk Cap ($)
    </label>

    <input
      type="number"
      id="maxStake"
      value="5000"
      min="1"
      step="1"
    >


    <label for="takeProfit">
      Take Profit Target ($)
    </label>

    <input
      type="number"
      id="takeProfit"
      value="10"
      min="0"
      step="0.01"
    >


    <button
      class="start"
      onclick="startBot()"
    >
      ACTIVATE PREMIUM SCRIPT
    </button>


    <button
      class="stop"
      onclick="stopBot()"
    >
      EMERGENCY DISCONNECT
    </button>


    <div
      class="engine-status"
      id="engineStatus"
    >
      Engine waiting for activation
    </div>

  </div>


  <div class="card">

    <h2>LIVE SYSTEM METRICS</h2>

    <div class="metrics">

      <div class="metric">
        <div class="metric-title">
          Account Balance
        </div>

        <div
          class="metric-value"
          id="balance"
        >
          $0.00
        </div>
      </div>


      <div class="metric">
        <div class="metric-title">
          Active Working Stake
        </div>

        <div
          class="metric-value"
          id="currentStake"
        >
          $2.00
        </div>
      </div>


      <div class="metric">
        <div class="metric-title">
          Net Profit / Loss Session
        </div>

        <div
      <div
        class="metric-value"
        id="profitLoss"
      >
        $0.00
      </div>

    </div>
  </div>

  <script>
    /*
     * ApexBot dashboard connection
     *
     * If your dashboard and backend are hosted on different
     * addresses, change BACKEND_URL to your backend URL.
     */
    const BACKEND_URL = '';

    async function startBot() {

      const status = document.getElementById('engineStatus');

      status.textContent = 'Connecting to engine...';

      try {

        const initialStake =
          parseFloat(
            document.getElementById('initialStake')?.value || 2
          );

        const maxStake =
          parseFloat(
            document.getElementById('maxStake')?.value || 5000
          );

        const takeProfit =
          parseFloat(
            document.getElementById('takeProfit')?.value || 10
          );

        const response = await fetch(
          BACKEND_URL + '/api/bot/start',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              initialStake,
              maxStake,
              takeProfit
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || 'Unable to start bot'
          );
        }

        status.textContent =
          data.message || 'Engine running';

        updateStatus();

      } catch (error) {

        console.error(error);

        status.textContent =
          'Engine error: ' + error.message;
      }
    }


    async function stopBot() {

      const status =
        document.getElementById('engineStatus');

      try {

        const response = await fetch(
          BACKEND_URL + '/api/bot/stop',
          {
            method: 'POST'
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || 'Unable to stop bot'
          );
        }

        status.textContent =
          data.message || 'Engine stopped';

        updateStatus();

      } catch (error) {

        console.error(error);

        status.textContent =
          'Stop error: ' + error.message;
      }
    }


    async function updateStatus() {

      try {

        const response = await fetch(
          BACKEND_URL + '/api/status'
        );

        if (!response.ok) return;

        const data = await response.json();

        if (data.balance !== undefined) {
          document.getElementById('balance').textContent =
            '$' + Number(data.balance).toFixed(2);
        }

        if (data.currentStake !== undefined) {
          document.getElementById('currentStake').textContent =
            '$' + Number(data.currentStake).toFixed(2);
        }

        if (data.sessionProfit !== undefined) {
          document.getElementById('profitLoss').textContent =
            '$' + Number(data.sessionProfit).toFixed(2);
        }

        if (data.running !== undefined) {

          document.getElementById('engineStatus').textContent =
            data.running
              ? 'Engine running'
              : 'Engine waiting for activation';
        }

      } catch (error) {

        console.error(
          'Status update error:',
          error
        );
      }
    }


    /*
     * Check the backend when the dashboard loads.
     */
    updateStatus();


    /*
     * Refresh live metrics every 3 seconds.
     */
    setInterval(
      updateStatus,
      3000
    );
  </script>

</body>
  </html>
