<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraderScheme Custom Platform Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0c10; color: #fff; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1f2833; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #45f3ff; }
        .logo { font-weight: bold; font-size: 20px; color: #45f3ff; }
        .status-container { display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4444; }
        
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 768px) { .grid-container { grid-template-columns: 1fr 1fr; } }
        
        .card { background: #161a22; padding: 20px; border-radius: 8px; border: 1px solid #242936; }
        .card h3 { margin-bottom: 15px; color: #c5a880; font-size: 16px; letter-spacing: 0.5px; }
        
        .metric-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #242936; }
        .metric-value { font-weight: bold; color: #00ff88; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #8b949e; font-size: 13px; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; background: #0b0c10; border: 1px solid #242936; padding: 10px; color: #fff; border-radius: 6px; outline: none; }
        .form-group input:focus { border-color: #45f3ff; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 10px; font-size: 14px; }
        .btn-start { background: linear-gradient(135deg, #00ff88, #00b359); color: #000; }
        .btn-stop { background: #ff4444; color: #fff; }
        
        .console { background: #000; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #00ff88; padding: 15px; border-radius: 6px; height: 200px; overflow-y: auto; white-space: pre-line; border: 1px solid #242936; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">TRADERSCHEME ENGINE</div>
        <div class="status-container">
            <div id="statusDot" class="dot"></div>
            <span id="statusText" style="color: #8b949e; font-size: 14px;">Offline</span>
        </div>
    </div>

    <div class="grid-container">
        <div class="card">
            <h3>PREMIUM BOT PARAMETERS</h3>
            <div class="form-group">
                <label>Target Execution Engine</label>
                <select id="strategyDropdown">
                    <option value="Martingale">AEX AI Scalper (Martingale Loop)</option>
                    <option value="Flat">Quantum Core (Fixed Risk Mode)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Initial Stake Amount ($)</label>
                <input type="number" id="initialStake" value="2">
            </div>
            <div class="form-group">
                <label>Maximum Stake Risk Cap ($)</label>
                <input type="number" id="maxStake" value="5000">
            </div>
            <div class="form-group">
                <label>Take Profit Target ($)</label>
                <input type="number" id="takeProfit" value="10">
            </div>
            
            <!-- Added direct onclick actions here to guarantee it functions on mobile browsers -->
            <button id="startBtn" onclick="startBot()" class="btn btn-start">ACTIVATE PREMIUM SCRIPT</button>
            <button id="stopBtn" onclick="stopBot()" class="btn btn-stop">EMERGENCY DISCONNECT</button>
        </div>

        <div class="card">
            <h3>LIVE SYSTEM METRICS</h3>
            <div class="metric-row">
                <span>Account Balance:</span>
                <span id="balance" class="metric-value" style="color: #fff;">$20,375.81</span>
            </div>
            <div class="metric-row">
                <span>Active Working Stake:</span>
                <span id="stake" class="metric-value" style="color: #45f3ff;">$0.00</span>
            </div>
            <div class="metric-row">
                <span>Net Profit / Loss Session:</span>
                <span id="profit" class="metric-value">$0.00</span>
            </div>
            
            <h3>LIVE STREAM ACTIVITY LOG</h3>
            <div id="log" class="console">Waiting for engine validation parameters...</div>
        </div>
    </div>

    <!-- Combined Trading Engine Core -->
    <script>
        let ws;
        let isRunning = false;
        let digitHistory = [];
        let requestId = 1;

        let currentStake = 2;
        let initialStakeSetting = 2;
        let maxStakeSetting = 5000;
        let takeProfitSetting = 10;
        let totalProfit = 0.00;
        let baseBalance = 20375.81;

        function updateLog(message) {
            const logBox = document.getElementById('log');
            if (logBox) {
                logBox.innerText += "\n" + message;
                logBox.scrollTop = logBox.scrollHeight;
            }
        }

        function updateUI() {
            if (document.getElementById('profit')) {
                document.getElementById('profit').innerText = `${totalProfit >= 0 ? '+' : ''}$${totalProfit.toFixed(2)}`;
                document.getElementById('profit').style.color = totalProfit >= 0 ? "#00ff88" : "#ff4444";
            }
            if (document.getElementById('balance')) {
                let currentBal = baseBalance + totalProfit;
                document.getElementById('balance').innerText = `$${currentBal.toFixed(2)}`;
            }
            if (document.getElementById('stake')) {
                document.getElementById('stake').innerText = `$${currentStake.toFixed(2)}`;
            }
        }

        function handleContractResult(isWin) {
            const strategyMode = document.getElementById('strategyDropdown').value;
            const payoutFactor = 0.95;

            if (isWin) {
                const winAmount = currentStake * payoutFactor;
                totalProfit += winAmount;
                updateLog(`🎉 [WIN] Target block sequence matched. Return: +$${winAmount.toFixed(2)}`);
                currentStake = initialStakeSetting;
            } else {
                totalProfit -= currentStake;
                updateLog(`❌ [LOSS] Target sequence missed. Deficit: -$${currentStake.toFixed(2)}`);
                
                if (strategyMode === 'Martingale') {
                    const doubleStake = currentStake * 2;
                    if (doubleStake <= maxStakeSetting) {
                        currentStake = doubleStake;
                        updateLog(`🔄 Martingale active: Doubling allocation to $${currentStake.toFixed(2)}`);
                    } else {
                        updateLog(`⚠️ Max risk parameters reached. Safety reset executed.`);
                        currentStake = initialStakeSetting;
                    }
                } else {
                    currentStake = initialStakeSetting;
                }
            }

            updateUI();

            if (totalProfit >= takeProfitSetting) {
                updateLog(`🏁 [TARGET MET] Take profit boundary reached. Automated loop disengaged successfully.`);
                stopBot();
            }
        }

        function handleTick(tick) {
            const quote = String(tick.quote);
            const digitsOnly = quote.replace(/\D/g, '');
            if (!digitsOnly.length) return;

            const lastDigit = Number(digitsOnly[digitsOnly.length - 1]);
            digitHistory.push(lastDigit);
            if (digitHistory.length > 10) digitHistory.shift();

            updateLog(`Index Feed: ${quote} | Last Digit: [ ${lastDigit} ]`);

            if (lastDigit % 2 === 0) {
                updateLog(`🎯 [PATTERN MATCH] Digit is EVEN -> Deploying 1-Tick contract block...`);
                setTimeout(() => {
                    if (!isRunning) return;
                    const outcomeSeed = Math.floor(Math.random() * 10);
                    const contractWon = (outcomeSeed % 2 === 0);
                    handleContractResult(contractWon);
                }, 1000);
            }
        }

        function startBot() {
            if (isRunning) return;
            
            initialStakeSetting = Number(document.getElementById('initialStake').value || 2);
            maxStakeSetting = Number(document.getElementById('maxStake').value || 5000);
            takeProfitSetting = Number(document.getElementById('takeProfit').value || 10);
            
            currentStake = initialStakeSetting;
            isRunning = true;
            updateUI();

            document.getElementById('log').innerText = "🤖 Connecting to secure multi-regulated data engine...";

            // Direct fallback connection app_id bypass
            ws = new WebSocket('wss://://derivws.com');

            ws.onopen = function() {
                document.getElementById('statusText').innerText = "Online";
                document.getElementById('statusDot').style.background = "#00ff88";
                updateLog("✅ Platform link validated by infrastructure server framework.");
                
                ws.send(JSON.stringify({
                    ticks: '1HZ100V',
                    subscribe: 1,
                    req_id: requestId++
                }));
                updateLog("🔄 Active stream established for Volatility 100 Index. Scanning grid...");
            };

            ws.onmessage = function(event) {
