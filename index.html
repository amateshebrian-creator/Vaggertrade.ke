<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaggertrade Engine</title>
<style>
:root{--bg:#0b0f17;--card:#141a24;--text:#abb3bf;--muted:#647080;--green:#00c853;--red:#ff3d00;--border:#1f2937;--cyan:#00bcd4;--orange:#ff9100}
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:20px;display:flex;justify-content:center}
.container{width:100%;max-width:480px;display:flex;flex-direction:column;gap:20px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:15px}
h1{font-size:1.3rem;color:var(--cyan);margin:0;letter-spacing:1px}.status{display:flex;align-items:center;gap:8px;font-size:.9rem}.dot{width:10px;height:10px;border-radius:50%;background:var(--red)}.dot.online{background:var(--green);box-shadow:0 0 10px var(--green)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px}.title{font-size:.85rem;color:var(--orange);margin:0 0 15px;text-transform:uppercase;letter-spacing:.5px}
.group{margin-bottom:15px}label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}input,select{width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:#fff;font-size:1rem}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}.mode button{padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-weight:bold}.mode button.active{border-color:var(--cyan);color:var(--cyan)}.mode button.real.active{border-color:var(--red);color:var(--red)}
.btn{width:100%;padding:14px;border:0;border-radius:6px;font-size:.95rem;font-weight:bold;cursor:pointer;margin-top:10px}.start{background:var(--green);color:#fff}.stop{background:var(--red);color:#fff}
.metrics{display:flex;flex-direction:column;gap:12px}.row{display:flex;justify-content:space-between;font-size:.95rem}.value{font-weight:bold;color:#fff}.positive{color:var(--green)}
.console{background:#05070a;border:1px solid var(--border);border-radius:6px;padding:12px;height:150px;overflow-y:auto;font-family:monospace;font-size:.78rem;color:var(--green);line-height:1.5}.warning{font-size:.78rem;color:var(--orange);margin-top:10px}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>VAGGERTRADE ENGINE</h1><div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Offline</span></div></div>

<div class="panel">
<h2 class="title">Account Mode</h2>
<div class="mode"><button id="demoBtn" class="active" type="button">DEMO</button><button id="realBtn" class="real" type="button">REAL</button></div>
<div class="warning" id="modeWarning">Demo mode selected. No real-money trades should be placed.</div>
</div>

<div class="panel">
<h2 class="title">Premium Bot Parameters</h2>
<div class="group"><label>Target Execution Engine</label><select id="engineType"><option value="martingale">Vaggertrade AI Scalper (Martingale Loop)</option></select></div>
<div class="group"><label>Initial Stake Amount ($)</label><input type="number" id="initialStake" value="2" min="0.35" step="0.01"></div>
<div class="group"><label>Maximum Stake Risk Cap ($)</label><input type="number" id="riskCap" value="5000" min="0.35" step="0.01"></div>
<div class="group"><label>Take Profit Target ($)</label><input type="number" id="takeProfit" value="10" min="0.01" step="0.01"></div>
<button class="btn start" id="btnStart" type="button">ACTIVATE ENGINE</button>
<button class="btn stop" id="btnStop" type="button">EMERGENCY DISCONNECT</button>
</div>

<div class="panel">
<h2 class="title">Live System Metrics</h2>
<div class="metrics">
<div class="row"><span>Account Balance:</span><span class="value" id="uiBalance">$0.00</span></div>
<div class="row"><span>Active Working Stake:</span><span class="value" id="uiStake">$0.00</span></div>
<div class="row"><span>Net Profit / Loss:</span><span class="value positive" id="uiProfit">$0.00</span></div>
<div class="row"><span>Account Mode:</span><span class="value" id="uiMode">DEMO</span></div>
</div></div>

<div class="panel"><h2 class="title">Live Stream Activity Log</h2><div class="console" id="consoleLog">Waiting for engine validation...</div></div>
</div>

<script>
const BACKEND_URL='';
let selectedMode='demo';
const $=id=>document.getElementById(id);

function log(message){const line='['+new Date().toLocaleTimeString()+'] '+message;$('consoleLog').innerHTML+='<br>'+line;$('consoleLog').scrollTop=$('consoleLog').scrollHeight;}

function setMode(mode){
 selectedMode=mode;$('demoBtn').classList.toggle('active',mode==='demo');$('realBtn').classList.toggle('active',mode==='real');$('uiMode').textContent=mode.toUpperCase();
 if(mode==='real'){$('modeWarning').textContent='REAL mode selected. Confirm carefully before activating. This can use real funds.';$('modeWarning').style.color='var(--red)';}
 else{$('modeWarning').textContent='Demo mode selected. No real-money trades should be placed.';$('modeWarning').style.color='var(--orange)';}
}

async function updateStatus(){
 try{
  const response=await fetch(BACKEND_URL+'/api/status');if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();$('statusDot').classList.add('online');$('statusText').textContent=data.running?'Online / Running':'Online / Ready';
  const balance=Number(data.balance??data.accountBalance??0),stake=Number(data.currentStake??0),profit=Number(data.sessionProfit??0);
  $('uiBalance').textContent='$'+balance.toFixed(2);$('uiStake').textContent='$'+stake.toFixed(2);$('uiProfit').textContent=(profit>=0?'+$':'-$')+Math.abs(profit).toFixed(2);
  if(Array.isArray(data.logs)&&data.logs.length){$('consoleLog').innerHTML=data.logs.slice(-30).map(x=>x.replace(/</g,'&lt;')).join('<br>');$('consoleLog').scrollTop=$('consoleLog').scrollHeight;}
 }catch(error){$('statusDot').classList.remove('online');$('statusText').textContent='Backend Offline';}
}

async function startBot(){
 if(selectedMode==='real'){
  const confirmed=confirm('REAL mode can place trades using real funds.\n\nOnly continue if your server is configured with the correct REAL account credentials.\n\nContinue?');
  if(!confirmed)return;
 }
 const initialStake=Number($('initialStake').value),maxStake=Number($('riskCap').value),takeProfit=Number($('takeProfit').value);
 if(!Number.isFinite(initialStake)||initialStake<=0||!Number.isFinite(maxStake)||maxStake<initialStake||!Number.isFinite(takeProfit)||takeProfit<=0){alert('Check the stake, maximum stake, and take-profit values.');return;}
 $('btnStart').disabled=true;log('Requesting '+selectedMode.toUpperCase()+' engine...');
 try{
  const response=await fetch(BACKEND_URL+'/api/bot/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:selectedMode,initialStake,maxStake,takeProfit})});
  const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to start engine');log(data.message||'Engine started.');await updateStatus();
 }catch(error){log('ERROR: '+error.message);alert(error.message);}finally{$('btnStart').disabled=false;}
}

async function stopBot(){
 try{const response=await fetch(BACKEND_URL+'/api/bot/stop',{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Unable to stop engine');log(data.message||'Engine stopped.');await updateStatus();}
 catch(error){log('ERROR: '+error.message);}
}

$('demoBtn').addEventListener('click',()=>setMode('demo'));$('realBtn').addEventListener('click',()=>setMode('real'));$('btnStart').addEventListener('click',startBot);$('btnStop').addEventListener('click',stopBot);
setMode('demo');updateStatus();setInterval(updateStatus,3000);
</script>
</body>
</html>
